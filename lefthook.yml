# Git hooks. Run `pnpm exec lefthook install` once to wire them into .git/hooks.
pre-push:
  jobs:
    - name: quality-gate
      run: pnpm check

check:
  piped: true
  jobs:
    - name: astro
      run: astro check
    - name: verify
      group:
        parallel: true
        jobs:
          - name: css
            run: stylelint "{src,packages}/**/*.{css,astro}" --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --check . --cache --log-level warn
          - name: js
            run: eslint --max-warnings 0 --cache --cache-location node_modules/.cache/eslint/
          - name: unused
            run: knip
          # Dead code stays with knip; fallow's unused-code rules are off in .fallowrc.jsonc
          - name: dupes
            run: fallow dupes --quiet
          # Health prints its report even at zero findings, so output shows only on failure
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          - name: architecture
            run: fallow dead-code --boundary-violations --circular-deps --quiet
          - name: test
            run: vitest run

fix:
  piped: true
  jobs:
    - name: autofix
      group:
        piped: true
        jobs:
          - name: css
            run: stylelint "{src,packages}/**/*.{css,astro}" --fix --cache --cache-location node_modules/.cache/stylelint/
          - name: format
            run: prettier --write . --cache --list-different
          - name: js
            run: eslint --fix --cache --cache-location node_modules/.cache/eslint/
    - name: astro
      run: astro check
    - name: verify
      group:
        parallel: true
        jobs:
          - name: unused
            run: knip
          - name: dupes
            run: fallow dupes --quiet
          - name: complexity
            run: out=$(fallow health --complexity --quiet 2>&1) || { printf '%s\n' "$out"; exit 1; }
          - name: architecture
            run: fallow dead-code --boundary-violations --circular-deps --quiet
