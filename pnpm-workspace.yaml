packages:
  - packages/*

# Intended to mitigate supply chain attacks
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - '@xsynaptic/*'
  - '@astrojs/*'
  - astro
  - '@typescript-eslint/eslint-plugin@8.72.1'
  - '@typescript-eslint/parser@8.72.1'
  - '@typescript-eslint/project-service@8.72.1'
  - '@typescript-eslint/scope-manager@8.72.1'
  - '@typescript-eslint/tsconfig-utils@8.72.1'
  - '@typescript-eslint/type-utils@8.72.1'
  - '@typescript-eslint/types@8.72.1'
  - '@typescript-eslint/typescript-estree@8.72.1'
  - '@typescript-eslint/utils@8.72.1'
  - '@typescript-eslint/visitor-keys@8.72.1'
  - typescript-eslint@8.72.1

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
ignoredOptionalDependencies:
  - fallow-type-aware

peerDependencyRules:
  allowedVersions:
    'astro-pagefind>astro': '7'
    # eslint-plugin-jsx-a11y@6.10.2 caps its eslint peer at ^9 but uses no APIs
    # removed in ESLint 10. Safe to run on 10 until upstream widens the range.
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite3: true
  usearch: true

permissions:
  fallow:
    skills: false
