packages:
  - packages/*

# Intended to mitigate supply chain attacks
minimumReleaseAge: 1440
verifyDepsBeforeRun: error
strictDepBuilds: true

minimumReleaseAgeExclude:
  - '@xsynaptic/*'
  - '@astrojs/*'
  - astro

# TypeScript 7 native binaries for fallow's type-aware mode, which this project does not use
# Removal override because pnpm 12.3.4 still installs packages listed in ignoredOptionalDependencies
overrides:
  fallow-type-aware: '-'

# This is required for pnpm deploy, which we use in combination with the image-server service
injectWorkspacePackages: true

peerDependencyRules:
  allowedVersions:
    'astro-pagefind>astro': '7'
    # eslint-plugin-jsx-a11y@6.10.2 caps its eslint peer at ^9 but uses no APIs
    # removed in ESLint 10. Safe to run on 10 until upstream widens the range.
    'eslint-plugin-jsx-a11y>eslint': '10'

allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite3: true
  usearch: true
