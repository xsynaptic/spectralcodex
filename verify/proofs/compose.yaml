services:
  lean:
    image: lean-elan:4.2.4
    build:
      dockerfile_inline: |
        FROM debian:trixie-slim@sha256:f6b08b09a05725f9431502d3b5714f5c4576e82c1a84fa1debe0c24a7e0c3ec4 AS elan
        RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl \
          && curl -sSfL -o /elan-init.sh https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
          && echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /elan-init.sh' | sha256sum -c - \
          && sh /elan-init.sh -y --default-toolchain none

        FROM gcr.io/distroless/cc-debian13@sha256:58e12be899275afaa05f1b03051ab19037ed7f252528e57a3a9ad7e220a62578
        COPY --from=elan /root/.elan /root/.elan
        ENV PATH=/root/.elan/bin:/usr/local/bin:/usr/bin:/bin
    working_dir: /proofs
    volumes:
      - .:/proofs
      - lean-toolchains:/root/.elan/toolchains
    command: ['lake', 'build', '--wfail']

volumes:
  lean-toolchains:
    name: lean-toolchains
